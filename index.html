<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://evntiqa.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary Meta Tags -->
    <title>Evntiqa - Premium Event Experience & Management</title>
    <meta name="title" content="Evntiqa - Premium Event Experience & Management" />
    <meta
      name="description"
      content="Discover Evntiqa. Premium event management, curated experiences, conferences, and exhibitions designed to deliver unforgettable moments."
    />
    <meta name="theme-color" content="#020617" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://evntiqa.com/" />
    <meta property="og:title" content="Evntiqa - Premium Event Experience & Management" />
    <meta
      property="og:description"
      content="Discover Evntiqa. Premium event management, curated experiences, conferences, and exhibitions designed to deliver unforgettable moments."
    />
    <meta property="og:image" content="https://evntiqa.com/og-image.jpg" />
    <meta property="og:site_name" content="Evntiqa" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://evntiqa.com/" />
    <meta name="twitter:title" content="Evntiqa - Premium Event Experience & Management" />
    <meta
      name="twitter:description"
      content="Discover Evntiqa. Premium event management, curated experiences, conferences, and exhibitions designed to deliver unforgettable moments."
    />
    <meta name="twitter:image" content="https://evntiqa.com/og-image.jpg" />

    <!-- Structured Data (JSON-LD) for Organization & WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://evntiqa.com/#organization",
            "name": "Evntiqa",
            "url": "https://evntiqa.com/",
            "logo": "https://evntiqa.com/favicon.svg",
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "@id": "https://evntiqa.com/#website",
            "url": "https://evntiqa.com/",
            "name": "Evntiqa",
            "publisher": {
              "@id": "https://evntiqa.com/#organization"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
